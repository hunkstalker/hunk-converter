[package]
name = "hunk-converter"
version = "0.2.0"
edition = "2024"
description = "Editor y conversor de imágenes local con Rust y egui"
license = "MIT"
rust-version = "1.99"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "x11",
] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "jpeg",
    "png",
    "tga",
    "webp",
] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
resvg = { version = "0.49.0", default-features = false, features = [
    "raster-images",
    "svgz",
    "system-fonts",
    "text",
] }
webp = "0.3.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
